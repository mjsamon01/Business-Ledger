<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Business Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (free Spark plan) — database + built-in offline support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.1/firebase-firestore-compat.min.js"></script>
<style>
  .sync-banner{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:#C79A3E; color:#16241F; text-align:center; font-size:12.5px; font-weight:600;
    padding:6px 10px; font-family:'Inter',sans-serif; display:none;
  }
  .sync-banner.show{ display:block; }
  .setup-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Inter',sans-serif; background:#16241F; color:#EFEEDE;
  }
  .setup-box{ max-width:480px; background:#1E332B; border-radius:10px; padding:28px; line-height:1.7; font-size:13.5px; }
  .setup-box h2{ font-family:'Space Grotesk',sans-serif; color:#C79A3E; margin-top:0; }
  .setup-box code{ background:#0d1614; padding:2px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  :root{
    --cover:#16241F;
    --cover-2:#1E332B;
    --paper:#EFEEDE;
    --paper-2:#E6E3D0;
    --ink:#1C2B26;
    --muted:#6B6355;
    --gold:#C79A3E;
    --gold-dark:#A67F2E;
    --forest:#2F6F4E;
    --brick:#B23A2E;
    --line:#D3CDB4;
    --white:#FBFAF4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cover);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* Sidebar styled as ledger binder tabs */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--cover) 0%, var(--cover-2) 100%);
    padding:28px 0 20px 0;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 22px 22px 22px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    margin-bottom:14px;
  }
  .brand-mark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--white);
    letter-spacing:0.02em;
  }
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--gold);
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:4px;
  }
  .nav{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1;
  }
  .nav-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 22px 12px 22px;
    color:rgba(255,255,255,0.68);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    border:none;
    background:transparent;
    text-align:left;
    font-family:'Inter',sans-serif;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item .tab-flag{
    width:5px;
    height:20px;
    border-radius:2px;
    flex-shrink:0;
    opacity:0.55;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:var(--white); }
  .nav-item.active{
    background:var(--paper);
    color:var(--ink);
    font-weight:600;
  }
  .nav-item.active .tab-flag{ opacity:1; }
  .nav-count{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(178,58,46,0.9);
    color:white;
    border-radius:10px;
    padding:1px 7px;
  }
  .sidebar-foot{
    padding:14px 22px 0 22px;
    border-top:1px solid rgba(255,255,255,0.08);
    margin-top:10px;
  }
  .reset-btn{
    background:none;border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.55);
    font-size:11px;padding:7px 10px;border-radius:6px;cursor:pointer;width:100%;
    font-family:'Inter',sans-serif;
  }
  .reset-btn:hover{ border-color:var(--brick); color:#ffb3a8; }

  /* Main page */
  .page{
    flex:1;
    background:var(--paper);
    min-height:100vh;
    padding:32px 40px 60px 40px;
  }
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:26px;
    flex-wrap:wrap;
    gap:12px;
  }
  .page-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
  }
  .page-desc{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 18px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    cursor:pointer;
  }
  .btn:hover{ background:#0d1614; }
  .btn.secondary{ background:transparent; color:var(--ink); }
  .btn.secondary:hover{ background:rgba(0,0,0,0.05); }
  .btn.danger{ border-color:var(--brick); color:var(--brick); background:transparent; }
  .btn.danger:hover{ background:rgba(178,58,46,0.08); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:4px; }

  /* Cards */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:28px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--gold);
  }
  .card.positive::before{ background:var(--forest); }
  .card.negative::before{ background:var(--brick); }
  .card-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    font-weight:600;
  }
  .card-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:24px;
    font-weight:600;
    margin-top:6px;
    color:var(--ink);
  }
  .card-value.positive{ color:var(--forest); }
  .card-value.negative{ color:var(--brick); }

  .money{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }

  /* Filter bar */
  .filterbar{
    display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap;
  }
  select, input, textarea{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--white);
    color:var(--ink);
  }
  label{ font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:4px; }

  /* Table */
  .table-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:24px;
  }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    font-weight:600;
    padding:10px 14px;
    border-bottom:2px solid var(--ink);
    background:var(--paper-2);
  }
  tbody td{
    padding:11px 14px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#F7F5EA; }
  .num{ text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .row-actions{ display:flex; gap:6px; }
  .pill{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .pill.low{ background:rgba(178,58,46,0.12); color:var(--brick); }
  .pill.ok{ background:rgba(47,111,78,0.12); color:var(--forest); }
  .empty{ padding:34px; text-align:center; color:var(--muted); font-size:13px; }

  /* Chart bars */
  .chart{ background:var(--white); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:24px; }
  .chart-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin-bottom:16px; }
  .bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .bar-label{ width:38px; font-size:12px; font-weight:600; color:var(--muted); flex-shrink:0; }
  .bar-track{ flex:1; background:var(--paper-2); border-radius:4px; height:22px; position:relative; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; }
  .bar-fill.sales{ background:var(--forest); }
  .bar-fill.expenses{ background:var(--brick); }
  .bar-value{ width:100px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; flex-shrink:0; }
  .legend{ display:flex; gap:16px; margin-top:6px; font-size:11.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .banner{
    background:#FBEFEA; border:1px solid var(--brick); color:#7A2A20; border-radius:8px;
    padding:12px 16px; font-size:13px; margin-bottom:22px; display:flex; align-items:center; gap:10px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,30,26,0.55);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--white); border-radius:10px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  }
  .modal-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; }
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; }
  .modal-body{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
  .field{ display:flex; flex-direction:column; }
  .field input, .field select, .field textarea{ width:100%; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint{ font-size:11px; color:var(--muted); margin-top:3px; }

  .section-note{
    background:var(--white); border:1px dashed var(--line); border-radius:8px; padding:14px 16px;
    font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.6;
  }
  .quarter-tag{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
    background:var(--paper-2); padding:2px 8px; border-radius:4px;
  }
  @media(max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px; }
    .brand{ display:none; }
    .nav{ flex-direction:row; }
    .page{ padding:20px; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="sync-banner" id="syncBanner">⚠ Offline — changes are saved on this device and will sync automatically once you're back online.</div>
<div id="root"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalContent"></div></div>

<script>
/* =========================================================================
   FIREBASE SETUP — paste your project's config below.
   Get it from: Firebase Console > Project Settings > General > Your apps > SDK setup and configuration
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAnsSxKVGoloQ3L6vwplp9ElGGK77K3SfY",
  authDomain: "business-ledger-f9c92.firebaseapp.com",
  projectId: "business-ledger-f9c92",
  storageBucket: "business-ledger-f9c92.firebasestorage.app",
  messagingSenderId: "739906976761",
  appId: "1:739906976761:web:d0af091de48a8a5e97db28"
};

let db = null;
let firebaseReady = false;

function isConfigFilled(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("PASTE_");
}

function showSetupScreen(){
  document.getElementById('root').innerHTML = `
    <div class="setup-screen"><div class="setup-box">
      <h2>One more step ⚙️</h2>
      <p>This app needs your Firebase project's connection details before it can save data.</p>
      <p>Open <code>index.html</code> in a text/code editor, find <code>firebaseConfig</code> near the top of the script, and paste in the values from your Firebase Console (Project Settings → General → Your apps → SDK setup and configuration).</p>
      <p>Save the file, re-upload to GitHub, and reload this page.</p>
    </div></div>`;
}

function initFirebase(){
  if(!isConfigFilled()){ showSetupScreen(); return false; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    // Enables offline reads/writes: cached locally, auto-syncs when back online.
    db.enablePersistence({synchronizeTabs:true}).catch(err=>{
      console.warn('Offline persistence not enabled:', err.code);
    });
    firebaseReady = true;
    return true;
  }catch(e){
    console.error('Firebase init failed', e);
    showSetupScreen();
    return false;
  }
}

function updateSyncBanner(){
  const banner = document.getElementById('syncBanner');
  if(!banner) return;
  if(navigator.onLine){ banner.classList.remove('show'); }
  else{ banner.classList.add('show'); }
}
window.addEventListener('online', updateSyncBanner);
window.addEventListener('offline', updateSyncBanner);

/* ---------------- Storage helpers (Firestore-backed, offline-capable) ---------------- */
const DOC_COLLECTION = 'ledger-data'; // one document per data key, e.g. products, orders...

async function loadKey(key, fallback){
  try{
    const snap = await db.collection(DOC_COLLECTION).doc(key).get();
    if(snap.exists && snap.data() && typeof snap.data().value === 'string'){
      return JSON.parse(snap.data().value);
    }
    return fallback;
  }catch(e){ console.error('load failed', key, e); return fallback; }
}
async function saveKey(key, value){
  try{
    await db.collection(DOC_COLLECTION).doc(key).set({
      value: JSON.stringify(value),
      updatedAt: Date.now()
    });
  }catch(e){ console.error('storage save failed', key, e); }
}

/* ---------------- State ---------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);

let state = {
  ready:false,
  tab:'dashboard',
  products:[],
  orders:[],
  expenses:[],
  adjustments:[],
  tax:{ rate:0.03, exempt:{}, vat8:false },
  filterYear:new Date().getFullYear(),
  filterQuarter:'ALL',
  offeringPct:0.10
};

const PLATFORMS=['Shopee','TikTok Shop','Lazada','Facebook','Instagram','Walk-in','Other'];
const EXPENSE_CATS=['Packaging','Shipping','Marketing','Rent','Utilities','Supplies/Materials','Salaries','Taxes & Fees','Other'];

function peso(n){
  const v = Number(n)||0;
  const s = v.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0? '-₱'+s.replace('-',''): '₱'+s);
}
function quarterOf(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const m=d.getMonth()+1;
  const q= m<=3?1:m<=6?2:m<=9?3:4;
  return {year:d.getFullYear(), q};
}
function qKey(year,q){ return year+'-Q'+q; }

function currentStock(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return 0;
  let stock = Number(p.openingStock)||0;
  state.adjustments.filter(a=>a.productId===productId).forEach(a=>{
    stock += a.type==='in' ? Number(a.qty) : -Number(a.qty);
  });
  state.orders.filter(o=>o.productId===productId).forEach(o=>{ stock -= Number(o.qty); });
  return stock;
}

function availableYears(){
  const ys = new Set([new Date().getFullYear()]);
  state.orders.forEach(o=>ys.add(quarterOf(o.date).year));
  state.expenses.forEach(e=>ys.add(quarterOf(e.date).year));
  return Array.from(ys).sort((a,b)=>b-a);
}

function ordersInScope(year,q){
  return state.orders.filter(o=>{
    const qq=quarterOf(o.date);
    return qq.year===year && (q==='ALL' || qq.q===q);
  });
}
function expensesInScope(year,q){
  return state.expenses.filter(e=>{
    const qq=quarterOf(e.date);
    return qq.year===year && (q==='ALL' || qq.q===q);
  });
}

/* ---------------- Render root ---------------- */
function render(){
  const root=document.getElementById('root');
  if(!state.ready){
    root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#EFEEDE;font-family:Inter,sans-serif;">Loading your ledger…</div>';
    return;
  }
  const lowStock = state.products.filter(p=>currentStock(p.id) <= Number(p.lowStockAlert||0));
  root.innerHTML = `
    <div class="app">
      ${renderSidebar(lowStock.length)}
      <div class="page">${renderPage(lowStock)}</div>
    </div>
  `;
}

function navItem(id,label,color,count){
  const active = state.tab===id ? 'active':'';
  return `<button class="nav-item ${active}" data-action="nav" data-tab="${id}">
    <span class="tab-flag" style="background:${color}"></span>
    ${label}
    ${count?`<span class="nav-count">${count}</span>`:''}
  </button>`;
}

function renderSidebar(lowCount){
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">Ledger</div>
      <div class="brand-sub">Business Tracker</div>
    </div>
    <div class="nav">
      ${navItem('dashboard','Dashboard','#C79A3E')}
      ${navItem('sales','Sales / Orders','#2F6F4E')}
      ${navItem('products','Products / Offerings','#C79A3E')}
      ${navItem('expenses','Expenses','#B23A2E')}
      ${navItem('inventory','Inventory','#3E6B8A', lowCount>0?lowCount:0)}
      ${navItem('tax','Quarterly Tax','#5B4B8A')}
    </div>
    <div class="sidebar-foot">
      <button class="reset-btn" data-action="reset-all">Reset all data</button>
    </div>
  </div>`;
}

function renderPage(lowStock){
  switch(state.tab){
    case 'dashboard': return renderDashboard(lowStock);
    case 'sales': return renderSales();
    case 'products': return renderProducts();
    case 'expenses': return renderExpenses();
    case 'inventory': return renderInventory(lowStock);
    case 'tax': return renderTax();
    default: return '';
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(lowStock){
  const years = availableYears();
  const y = state.filterYear;
  const q = state.filterQuarter;
  const ords = ordersInScope(y,q);
  const exps = expensesInScope(y,q);
  const totalSales = ords.reduce((s,o)=>s+Number(o.qty)*Number(o.unitPrice),0);
  const totalCost = ords.reduce((s,o)=>s+Number(o.qty)*Number(o.unitCost),0);
  const grossProfit = totalSales-totalCost;
  const totalExpenses = exps.reduce((s,e)=>s+Number(e.amount),0);
  const netProfit = grossProfit-totalExpenses;
  const offering = Math.max(0,netProfit) * Number(state.offeringPct);

  const quarters=[1,2,3,4];
  const qData = quarters.map(qq=>{
    const qo = ordersInScope(y,qq);
    const qe = expensesInScope(y,qq);
    return { q:qq, sales:qo.reduce((s,o)=>s+Number(o.qty)*Number(o.unitPrice),0), expenses:qe.reduce((s,e)=>s+Number(e.amount),0) };
  });
  const maxVal = Math.max(1,...qData.map(d=>Math.max(d.sales,d.expenses)));

  const recent = [...state.orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-desc">Kita, gastos, at kalusugan ng negosyo sa isang tingin.</div>
      </div>
      <div class="filterbar">
        <div class="field"><label>Year</label>
          <select data-action="filter-year">${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Quarter</label>
          <select data-action="filter-quarter">
            <option value="ALL" ${q==='ALL'?'selected':''}>Full Year</option>
            <option value="1" ${q==1?'selected':''}>Q1 (Jan–Mar)</option>
            <option value="2" ${q==2?'selected':''}>Q2 (Apr–Jun)</option>
            <option value="3" ${q==3?'selected':''}>Q3 (Jul–Sep)</option>
            <option value="4" ${q==4?'selected':''}>Q4 (Oct–Dec)</option>
          </select>
        </div>
      </div>
    </div>

    ${lowStock.length>0?`<div class="banner">⚠ ${lowStock.length} product${lowStock.length>1?'s are':' is'} at or below its low-stock alert level — check the Inventory tab.</div>`:''}

    <div class="cards">
      <div class="card"><div class="card-label">Total Sales</div><div class="card-value money">${peso(totalSales)}</div></div>
      <div class="card"><div class="card-label">Total Cost of Goods</div><div class="card-value money">${peso(totalCost)}</div></div>

/* ---------------- Tax ---------------- */
function renderTax(){
  const years = availableYears();
  const y = state.filterYear;
  const quarters=[1,2,3,4];
  const rate = Number(state.tax.rate);
  let annualTaxable=0, annualDue=0, annualGross=0;
  const rowsHtml = quarters.map(q=>{
    const key=qKey(y,q);
    const ords=ordersInScope(y,q);
    const gross = ords.reduce((s,o)=>s+Number(o.qty)*Number(o.unitPrice),0);
    const exempt = Number(state.tax.exempt[key]||0);
    const taxable = Math.max(0, gross-exempt);
    const due = taxable*rate;
    annualGross+=gross; annualTaxable+=taxable; annualDue+=due;
    const periods=['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'];
    return `<tr>
      <td><span class="quarter-tag">Q${q}</span></td><td>${periods[q-1]}</td>
      <td class="num">${peso(gross)}</td>
      <td class="num"><input type="number" min="0" step="0.01" style="width:100px;text-align:right" value="${exempt}" data-action="exempt-input" data-key="${key}"></td>
      <td class="num">${peso(taxable)}</td>
      <td class="num">${(rate*100).toFixed(1)}%</td>
      <td class="num"><strong>${peso(due)}</strong></td>
      <td>BIR Form 2551Q</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-header">
      <div><div class="page-title">Quarterly Tax Summary</div><div class="page-desc">Percentage Tax (2551Q) estimate based sa iyong logged sales.</div></div>
      <div class="filterbar">
        <div class="field"><label>Year</label>
          <select data-action="filter-year">${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Tax Rate</label>
          <select data-action="tax-rate">
            <option value="0.03" ${rate===0.03?'selected':''}>3% (Percentage Tax)</option>
            <option value="0.01" ${rate===0.01?'selected':''}>1% (reduced rate)</option>
            <option value="0.08" ${rate===0.08?'selected':''}>8% (8% IT Option)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Quarter</th><th>Period</th><th style="text-align:right">Gross Sales</th><th style="text-align:right">Less: Exempt Sales</th><th style="text-align:right">Taxable Gross Sales</th><th style="text-align:right">Rate</th><th style="text-align:right">Tax Due</th><th>Notes</th></tr></thead>
        <tbody>
          ${rowsHtml}
          <tr style="background:var(--paper-2); font-weight:600;">
            <td colspan="2">Annual Summary — ${y}</td>
            <td class="num">${peso(annualGross)}</td><td></td>
            <td class="num">${peso(annualTaxable)}</td><td></td>
            <td class="num">${peso(annualDue)}</td><td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section-note">
      <strong>Based on a Non-VAT / Percentage Tax (2551Q) setup.</strong><br>
      • Exempt sales per quarter are editable above — type directly in the field.<br>
      • Taxable Gross Sales = Gross Sales − Exempt Sales. Tax Due = Taxable Gross Sales × rate.<br>
      • This is an organizer, not tax advice — confirm final filing amounts against your BIR Certificate of Registration and current BIR rules before you file.
    </div>
  `;
}

/* ---------------- Actions ---------------- */
async function handleAction(action, el){
  const id = el.getAttribute('data-id');
  switch(action){
    case 'nav': state.tab = el.getAttribute('data-tab'); render(); break;
    case 'filter-year': state.filterYear = Number(el.value); render(); break;
    case 'filter-quarter': state.filterQuarter = el.value==='ALL'?'ALL':Number(el.value); render(); break;
    case 'tax-rate': state.tax.rate = Number(el.value); saveKey('tax-settings', state.tax); render(); break;
    case 'offering-pct': {
      let pct = Number(el.value);
      if(isNaN(pct)) pct = 10;
      pct = Math.min(100, Math.max(0, pct));
      state.offeringPct = pct/100;
      saveKey('settings', {offeringPct: state.offeringPct});
      render();
      setTimeout(()=>{ const f=document.querySelector('[data-action="offering-pct"]'); if(f){ f.focus(); } },0);
      break;
    }
    case 'exempt-input': {
      const key = el.getAttribute('data-key');
      state.tax.exempt[key] = Number(el.value)||0;
      saveKey('tax-settings', state.tax);
      render();
      // restore focus after re-render
      setTimeout(()=>{ const f=document.querySelector(`[data-key="${key}"]`); if(f){ f.focus(); } },0);
      break;
    }
    case 'close-modal': closeModal(); break;

    case 'add-product': openModal(modalProductForm(null)); break;
    case 'edit-product': openModal(modalProductForm(state.products.find(p=>p.id===id))); break;
    case 'delete-product': {
      if(confirm('Delete this product? Related sales history will stay but show as (deleted product).')){
        state.products = state.products.filter(p=>p.id!==id);
        await saveKey('products', state.products); render();
      }
      break;
    }
    case 'save-product': {
      const val = {
        id: id || uid(),
        name: document.getElementById('f-name').value.trim() || 'Unnamed product',
        category: document.getElementById('f-category').value.trim(),
        supplier: document.getElementById('f-supplier').value.trim(),
        baseCost: Number(document.getElementById('f-cost').value)||0,
        sellingPrice: Number(document.getElementById('f-price').value)||0,
        openingStock: Number(document.getElementById('f-stock').value)||0,
        lowStockAlert: Number(document.getElementById('f-lowalert').value)||0
      };
      if(id){ state.products = state.products.map(p=>p.id===id?val:p); }
      else{ state.products.push(val); }
      await saveKey('products', state.products);
      closeModal(); render();
      break;
    }

    case 'add-order': openModal(modalOrderForm(null)); break;
    case 'edit-order': openModal(modalOrderForm(state.orders.find(o=>o.id===id))); break;
    case 'order-product-change': {
      const pid = document.getElementById('f-product').value;
      const p = state.products.find(x=>x.id===pid);
      if(p){ document.getElementById('f-unitprice').value = p.sellingPrice; document.getElementById('f-unitcost').value = p.baseCost; }
      break;
    }
    case 'delete-order': {
      if(confirm('Delete this sale? Stock will be restored.')){
        state.orders = state.orders.filter(o=>o.id!==id);
        await saveKey('orders', state.orders); render();
      }
      break;
    }
    case 'save-order': {
      const val = {
        id: id || uid(),
        date: document.getElementById('f-date').value || today(),
        orderNo: document.getElementById('f-orderno').value.trim(),
        customer: document.getElementById('f-customer').value.trim(),
        productId: document.getElementById('f-product').value,
        qty: Number(document.getElementById('f-qty').value)||1,
        unitPrice: Number(document.getElementById('f-unitprice').value)||0,
        unitCost: Number(document.getElementById('f-unitcost').value)||0,
        platform: document.getElementById('f-platform').value
      };
      if(id){ state.orders = state.orders.map(o=>o.id===id?val:o); }
      else{ state.orders.push(val); }
      await saveKey('orders', state.orders);
      closeModal(); render();
      break;
    }

    case 'add-expense': openModal(modalExpenseForm(null)); break;
    case 'edit-expense': openModal(modalExpenseForm(state.expenses.find(e=>e.id===id))); break;
    case 'delete-expense': {
      if(confirm('Delete this expense?')){
        state.expenses = state.expenses.filter(e=>e.id!==id);
        await saveKey('expenses', state.expenses); render();
      }
      break;
    }
    case 'save-expense': {
      const val = {
        id: id || uid(),
        date: document.getElementById('f-date').value || today(),
        category: document.getElementById('f-category').value,
        description: document.getElementById('f-desc').value.trim(),
        amount: Number(document.getElementById('f-amount').value)||0
      };
      if(id){ state.expenses = state.expenses.map(e=>e.id===id?val:e); }
      else{ state.expenses.push(val); }
      await saveKey('expenses', state.expenses);
      closeModal(); render();
      break;
    }

    case 'add-adjustment': openModal(modalAdjustmentForm()); break;
    case 'delete-adjustment': {
      if(confirm('Delete this adjustment?')){
        state.adjustments = state.adjustments.filter(a=>a.id!==id);
        await saveKey('adjustments', state.adjustments); render();
      }
      break;
    }
    case 'save-adjustment': {
      const val = {
        id: uid(),
        date: document.getElementById('f-date').value || today(),
        type: document.getElementById('f-type').value,
        productId: document.getElementById('f-product').value,
        qty: Number(document.getElementById('f-qty').value)||1,
        note: document.getElementById('f-note').value.trim()
      };
      state.adjustments.push(val);
      await saveKey('adjustments', state.adjustments);
      closeModal(); render();
      break;
    }

    case 'reset-all': {
      if(confirm('This will erase ALL your business data (products, sales, expenses, inventory, tax settings) from this device. Continue?')){
        state.products=[]; state.orders=[]; state.expenses=[]; state.adjustments=[];
        state.tax={rate:0.03, exempt:{}, vat8:false};
        await Promise.all([
          saveKey('products',[]), saveKey('orders',[]), saveKey('expenses',[]),
          saveKey('adjustments',[]), saveKey('tax-settings', state.tax)
        ]);
        render();
      }
      break;
    }
  }
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  handleAction(el.getAttribute('data-action'), el);
});
document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const liveActions = ['filter-year','filter-quarter','tax-rate','exempt-input','order-product-change','offering-pct'];
  if(liveActions.includes(el.getAttribute('data-action'))){
    handleAction(el.getAttribute('data-action'), el);
  }
});

/* ---------------- Init ---------------- */
async function init(){
  updateSyncBanner();
  if(!initFirebase()) return; // shows setup screen if config isn't filled in yet
  const [products, orders, expenses, adjustments, tax, settings] = await Promise.all([
    loadKey('products', []),
    loadKey('orders', []),
    loadKey('expenses', []),
    loadKey('adjustments', []),
    loadKey('tax-settings', {rate:0.03, exempt:{}, vat8:false}),
    loadKey('settings', {offeringPct:0.10})
  ]);
  state.products = products;
  state.orders = orders;
  state.expenses = expenses;
  state.adjustments = adjustments;
  state.tax = tax;
  state.offeringPct = (settings && typeof settings.offeringPct==='number') ? settings.offeringPct : 0.10;
  state.ready = true;
  render();
}
init();
</script>
